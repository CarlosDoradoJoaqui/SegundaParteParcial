name: Publicar vistas en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "public/**"
      - "angular.json"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Compilar la aplicación
        run: npx ng build --base-href /SegundaParteParcial/

      - name: Copiar la compilación a la raíz publicada
        run: |
          rm -f main-*.js styles-*.css
          rm -rf media
          cp -a dist/clinica-unicauca/browser/. .
          touch .nojekyll

      - name: Publicar en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html favicon.ico .nojekyll imagenes media main-*.js styles-*.css
          if git diff --staged --quiet; then
            echo "La compilación publicada ya está al día."
          else
            git commit -m "Actualiza las vistas publicadas de la clínica"
            git push
          fi
